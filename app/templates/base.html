<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodSpace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="header-container">
                <div class="logo">
                    <a href="http://moodspace.local:5000/">MoodSpace</a>
                </div>
                {% if current_user.is_authenticated %}
                <div class="user-menu">
                    <span>Привет, {{ current_user.username }}!</span>
                    <a href="{{ url_for('logout') }}" class="btn btn-small">Выйти</a>
                </div>
                {% endif %}
            </div>
        </header>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>MoodSpace - пространство для твоих эмоций</p>
        </footer>
    </div>
</body>
</html>
